<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation — LakeBite</title>
  <meta name="description" content="Your LakeBite order confirmation and tracking details.">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .confirm-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .confirm-card{max-width:560px;width:100%;background:var(--clr-card);border:1px solid var(--clr-border);border-radius:14px;padding:2.5rem;text-align:center;box-shadow:var(--shadow-lg)}
    .confirm-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;background:rgba(46,204,113,.12);color:#2ecc71;font-size:1.8rem}
    .confirm-card h1{font-family:var(--font-display);font-size:2rem;margin-bottom:.5rem}
    .confirm-card p{color:var(--clr-text-sub);margin-bottom:1.5rem}
    .order-box{border:1px solid var(--clr-border);border-radius:12px;padding:1.25rem;margin-bottom:1.5rem;text-align:left}
    .order-row{display:flex;justify-content:space-between;padding:.4rem 0;font-size:.95rem}
    .order-row.muted{color:var(--clr-text-sub)}
    .actions{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
    @media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;width:100%}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">LakeBite <span>Nairobi, Kenya</span></a>
      <div class="header-actions">
        <a href="menu.html" class="btn btn-outline">Back to Menu</a>
      </div>
    </div>
  </header>
  <main>
    <section class="confirm-wrap">
      <div class="confirm-card">
        <div class="confirm-icon"><i class="fa-solid fa-check"></i></div>
        <h1>Order Received</h1>
        <p>Thank you for your order. We'll start preparing it right away.</p>
        <div class="order-box">
          <div class="order-row"><span>Order Number</span><strong id="orderNum">—</strong></div>
          <div class="order-row muted"><span>Status</span><span id="orderStatus">new</span></div>
          <div class="order-row muted"><span>Payment</span><span id="paymentStatus">pending</span></div>
          <div class="order-row"><span>Total</span><strong id="orderTotal">KES 0</strong></div>
        </div>
        <div class="actions">
          <a href="menu.html" class="btn btn-primary"><i class="fa-solid fa-utensils"></i> Order More</a>
          <a href="index.html" class="btn btn-outline">Home</a>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const num = params.get('order');
    document.getElementById('orderNum').textContent = num || '—';
    if(num){
      fetch('/api/orders/track/' + encodeURIComponent(num)).then(r=>r.json()).then(d=>{
        if(d.order){
          const o=d.order;
          document.getElementById('orderStatus').textContent = o.status;
          document.getElementById('paymentStatus').textContent = o.paymentStatus;
          document.getElementById('orderTotal').textContent = 'KES ' + Number(o.total||0).toLocaleString();
          const itemsHtml=(o.items||[]).map(i=>`<div class="order-row"><span>${i.name} x${i.qty}</span><span>KES ${Number(i.price*i.qty).toLocaleString()}</span></div>`).join('');
          const type=o.type||'pickup';
          const delivery=type==='delivery'?(o.deliveryAddress||'—'):'Pickup';
          const receipt=`<div id="receipt" style="margin-top:1.5rem;text-align:left;border:1px solid var(--clr-border);border-radius:12px;padding:1.25rem">
            <h3 style="margin-bottom:1rem">Receipt</h3>
            <div class="order-row"><span>Order No.</span><strong>${o.orderNumber}</strong></div>
            <div class="order-row"><span>Customer</span><span>${o.customerName||'—'}</span></div>
            <div class="order-row"><span>Email</span><span>${o.customerEmail||'—'}</span></div>
            <div class="order-row"><span>Date/Time</span><span>${new Date(o.createdAt).toLocaleString()}</span></div>
            ${itemsHtml}
            <div class="order-row"><span>Payment Method</span><span>${o.paymentMethod||'pay-on-delivery'}</span></div>
            <div class="order-row"><span>Fulfillment</span><span>${type} - ${delivery}</span></div>
            <div class="order-row"><strong>Total</strong><strong>KES ${Number(o.total||0).toLocaleString()}</strong></div>
            <div style="text-align:center;margin-top:1rem"><img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(o.orderNumber)}" alt="QR" style="width:120px;height:120px"></div>
          </div>
          <div class="actions" style="margin-top:1rem"><button class="btn btn-outline" onclick="window.print()">Download / Print Receipt</button></div>`;
          document.querySelector('.order-box').insertAdjacentHTML('afterend', receipt);
        }
      }).catch(()=>{});
    }
  </script>
</body>
</html>
