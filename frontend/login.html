<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LakeBite</title>
  <meta name="description" content="Sign in or create an account at LakeBite.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Marcellus&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;isolation:isolate;overflow:hidden;padding:2rem;background:linear-gradient(135deg,rgba(8,30,20,.82),rgba(15,49,33,.55)),url('imege/upepo-restaurant.jpg') center/cover fixed}
    .auth-wrap::before,.auth-wrap::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(2px);pointer-events:none}
    .auth-wrap::before{width:340px;height:340px;top:7%;left:8%;background:radial-gradient(circle,rgba(224,181,90,.32),rgba(224,181,90,0) 70%)}
    .auth-wrap::after{width:440px;height:440px;right:5%;bottom:-12%;background:radial-gradient(circle,rgba(65,145,99,.38),rgba(65,145,99,0) 70%)}
    .auth-card{width:100%;max-width:460px;position:relative;overflow:hidden;background:rgba(248,245,240,.38);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(255,255,255,.42);border-radius:24px;padding:clamp(1.5rem,5vw,2.75rem);box-shadow:0 28px 90px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.45);color:var(--clr-text);text-shadow:0 1px 1px rgba(255,255,255,.18)}
    [data-theme="dark"] .auth-card{background:rgba(19,32,25,.34);border-color:rgba(255,255,255,.16);box-shadow:0 28px 90px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.1);text-shadow:0 1px 2px rgba(0,0,0,.35)}
    .auth-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,transparent,var(--clr-gold-lt),var(--clr-gold),transparent)}
    .auth-card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 35%,rgba(0,0,0,.03) 100%);pointer-events:none}
    [data-theme="dark"] .auth-card::after{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 35%,rgba(0,0,0,.08) 100%)}
    .auth-card{transform-style:preserve-3d;transform-origin:left center;backface-visibility:hidden}
    .auth-card.page-turn-out{animation:bookPageOut .42s cubic-bezier(.65,0,.35,1) both}
    .auth-card.page-turn-in{animation:bookPageIn .48s cubic-bezier(.2,.75,.25,1) both}
    @keyframes bookPageOut{0%{transform:perspective(1400px) rotateY(0) translateX(0);opacity:1}55%{box-shadow:0 22px 60px rgba(0,0,0,.22)}100%{transform:perspective(1400px) rotateY(-72deg) translateX(-14px);opacity:.2}}
    @keyframes bookPageIn{0%{transform:perspective(1400px) rotateY(72deg) translateX(14px);opacity:.2}100%{transform:perspective(1400px) rotateY(0) translateX(0);opacity:1}}
    @media(prefers-reduced-motion:reduce){.auth-card.page-turn-out,.auth-card.page-turn-in{animation-duration:.01ms}}
    .auth-card-header{text-align:center;margin-bottom:2rem}
    .auth-card-header .logo{justify-content:center;font-size:1.6rem}
    .auth-card-header p{margin-top:.5rem;color:var(--clr-text-sub);font-size:.9rem}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;margin-bottom:.5rem;font-size:.9rem;font-weight:500}
    .input-wrap{position:relative}
    .input-wrap input{width:100%;padding:.9rem 2.8rem .9rem .95rem;border:1px solid rgba(106,119,107,.28);border-radius:11px;background:rgba(255,255,255,.58);color:var(--clr-text);font-size:.95rem;font-weight:500;transition:border-color .2s,background .2s,box-shadow .2s}
    [data-theme="dark"] .input-wrap input{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.18);color:var(--clr-text)}
    .input-wrap input::placeholder{color:rgba(90,90,90,.85)}
    [data-theme="dark"] .input-wrap input::placeholder{color:rgba(240,236,228,.58)}
    .input-wrap input:focus-visible{outline:none;border-color:var(--clr-gold);background:rgba(255,255,255,.82);box-shadow:0 0 0 4px rgba(200,151,58,.16)}
    [data-theme="dark"] .input-wrap input:focus-visible{background:rgba(0,0,0,.42)}
    .form-group label{color:var(--clr-text);font-weight:600}
    .auth-card-header p,.toggle,.form-group small{color:var(--clr-text);opacity:.88}
    .toggle-pass{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--clr-text-sub);cursor:pointer}
    .auth-card button[type="submit"]{width:100%;margin-top:.5rem;padding:.95rem;border:none;border-radius:10px;background:linear-gradient(135deg,var(--clr-gold),#b8943f);color:#fff;cursor:pointer;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;display:flex;align-items:center;justify-content:center;gap:.6rem}
    .auth-card button[disabled]{opacity:.7;cursor:not-allowed}
    .toggle{text-align:center;margin-top:1.25rem;font-size:.9rem;color:var(--clr-text-sub)}
    .toggle a{color:var(--clr-gold);text-decoration:none}
    .msg{margin-top:1rem;text-align:center;color:#e74c3c;font-size:.9rem;min-height:1.2rem}
    .theme-row{display:flex;justify-content:flex-end;margin-bottom:1rem}
    .theme-btn{border:1px solid var(--clr-border);background:transparent;color:inherit;border-radius:50px;padding:.4rem .7rem;cursor:pointer}
    .auth-card button[type="submit"]{box-shadow:0 8px 20px rgba(160,111,29,.2);transition:transform .2s,box-shadow .2s}
    .auth-card button[type="submit"]:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(160,111,29,.3)}
    .auth-card-header .logo{color:var(--clr-primary)}
    [data-theme="dark"] .auth-card-header .logo{color:var(--clr-text)}
    .toggle-pass{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;}
    .toggle-pass:hover{color:var(--clr-gold);background:rgba(200,151,58,.1)}
    @media(max-width:520px){.auth-wrap{padding:1rem;background-attachment:scroll}.auth-card{border-radius:20px}.auth-card-header{margin-bottom:1.4rem}}
    .signup-only{display:none}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" role="main">
      <div class="theme-row">
        <button class="theme-btn" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      </div>
      <div class="auth-card-header">
        <a href="index.html" class="logo">LakeBite <span>Nairobi, Kenya</span></a>
        <p id="subtitle">Welcome back — sign in to continue</p>
      </div>
      <h1 id="title" style="font-family:var(--font-display);font-size:1.8rem;margin-bottom:1.25rem;text-align:center">Login</h1>
      <form id="form" novalidate>
        <div class="form-group" id="nameGroup" style="display:none">
          <label for="name">Full name</label>
          <div class="input-wrap">
            <input id="name" type="text" autocomplete="name" placeholder="e.g. Amara Ochieng">
          </div>
        </div>
        <div class="form-group signup-only" id="phoneGroup">
          <label for="phone">Phone number</label>
          <div class="input-wrap">
            <input id="phone" type="tel" autocomplete="tel" placeholder="+254 7XX XXX XXX" maxlength="40">
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
          </div>
        </div>
        <div class="form-group signup-only" id="confirmPasswordGroup">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrap">
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter your password">
            <button type="button" class="toggle-pass" id="toggleConfirmPass" aria-label="Show confirmation password"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Enter your password">
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
          <small style="display:block;margin-top:.4rem;color:var(--clr-text-sub);font-size:.82rem">Minimum 8 characters</small>
        </div>
        <button type="submit" id="submitBtn"><span id="submitText">Sign In</span><i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <div class="toggle"><span id="toggleText">Need an account?</span> <a href="#" id="toggle">Sign up</a></div>
      <div class="msg" id="msg" aria-live="polite"></div>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    let mode='login';
    const toggle=document.getElementById('toggle');
    const toggleText=document.getElementById('toggleText');
    const nameGroup=document.getElementById('nameGroup');
    const nameInput=document.getElementById('name');
    const titleEl=document.getElementById('title');
    const subtitle=document.getElementById('subtitle');
    const form=document.getElementById('form');
    const msg=document.getElementById('msg');
    const submitBtn=document.getElementById('submitBtn');
    const submitText=document.getElementById('submitText');
    const authCard=document.querySelector('.auth-card');
    const passwordInput=document.getElementById('password');
    const togglePass=document.getElementById('togglePass');
    const phoneInput=document.getElementById('phone');
    const confirmPasswordInput=document.getElementById('confirmPassword');
    const toggleConfirmPass=document.getElementById('toggleConfirmPass');

    togglePass.onclick=()=>{
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      togglePass.innerHTML = showing ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
      togglePass.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    };
    toggleConfirmPass.onclick=()=>{
      const showing = confirmPasswordInput.type === 'text';
      confirmPasswordInput.type = showing ? 'password' : 'text';
      toggleConfirmPass.innerHTML = showing ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
      toggleConfirmPass.setAttribute('aria-label', showing ? 'Show confirmation password' : 'Hide confirmation password');
    };

    toggle.onclick=e=>{
      e.preventDefault();
      if(authCard.classList.contains('page-turn-out')) return;
      authCard.classList.remove('page-turn-in');
      authCard.classList.add('page-turn-out');
      window.setTimeout(()=>{
      mode=mode==='login'?'signup':'login';
      titleEl.textContent=mode==='login'?'Login':'Create Account';
      subtitle.textContent=mode==='login'?'Welcome back — sign in to continue':'Join LakeBite for reservations and faster checkout';
      nameGroup.style.display=mode==='signup'?'block':'none';
      nameInput.required = mode==='signup';
      document.getElementById('phoneGroup').style.display=mode==='signup'?'block':'none';
      phoneInput.required = mode==='signup';
      document.getElementById('confirmPasswordGroup').style.display=mode==='signup'?'block':'none';
      confirmPasswordInput.required = mode==='signup';
      toggleText.textContent=mode==='login'?'Need an account?':'Already have an account?';
      toggle.textContent=mode==='login'?'Sign up':'Log in';
      passwordInput.setAttribute('autocomplete', mode==='login'?'current-password':'new-password');
      msg.textContent='';
      authCard.classList.remove('page-turn-out');
      authCard.classList.add('page-turn-in');
      window.setTimeout(()=>authCard.classList.remove('page-turn-in'),500);
      },400);
    };

    form.onsubmit=async e=>{
      e.preventDefault();
      msg.textContent='';
      msg.style.color='#e74c3c';
      const email=document.getElementById('email').value.trim();
      const password=passwordInput.value;
      if(password.length < 8){ msg.textContent='Password must be at least 8 characters.'; return; }
      const url=mode==='login'?'/api/login':'/api/register';
      const body=mode==='login'?{email,password}:{name:nameInput.value.trim(),phone:phoneInput.value.trim(),email,password};
      if(mode==='signup' && !body.name){ msg.textContent='Please enter your full name.'; return; }
      if(mode==='signup' && !body.phone){ msg.textContent='Please enter your phone number.'; return; }
      if(mode==='signup' && password!==confirmPasswordInput.value){ msg.textContent='Passwords do not match.'; return; }
      submitBtn.disabled=true;
      submitText.textContent='Please wait...';
      try {
        const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'include'});
        const d=await r.json();
        if(!r.ok){ msg.textContent=d.error||'Unable to sign in.'; submitBtn.disabled=false; submitText.textContent=mode==='login'?'Sign In':'Create Account'; return; }
        const returnPage=new URLSearchParams(location.search).get('return');
        if(d.user && d.user.role==='admin') location.href='/admin';
        else if(['contact.html','reservation.html'].includes(returnPage)) location.href=returnPage;
        else location.href='/';
      } catch (err) {
        msg.textContent='Network error. Please try again.';
        submitBtn.disabled=false;
        submitText.textContent=mode==='login'?'Sign In':'Create Account';
      }
    };
  </script>
</body>
</html>
