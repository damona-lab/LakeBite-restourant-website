<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — LakeBite</title>
  <meta name="description" content="Complete your LakeBite order.">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body{min-height:100vh;background:radial-gradient(ellipse at 10% 0,rgba(200,151,58,.12),transparent 35%),var(--clr-bg)}
    .checkout-page{padding:calc(var(--header-h) + 3rem) 0 5rem}
    .checkout-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem}
    .checkout-top .logo{font-size:1.65rem}
    .checkout-top a.back-link{color:var(--clr-text-sub);font-size:.9rem}
    .checkout-top a:hover{color:var(--clr-gold)}
    .checkout-heading{margin-bottom:2rem}
    .checkout-heading h1{font-size:clamp(2.3rem,5vw,3.5rem);margin:.2rem 0 .45rem}
    .checkout-heading p{color:var(--clr-text-sub)}
    .checkout-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);gap:2rem;align-items:start}
    .checkout-panel,.checkout-summary{background:var(--clr-card);border:1px solid var(--clr-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)}
    .checkout-panel{padding:clamp(1.25rem,4vw,2.5rem)}
    .checkout-panel h2,.checkout-summary h2{font-size:1.55rem;margin-bottom:1.4rem}
    .checkout-fields{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .checkout-fields .admin-form-group{margin:0 0 .4rem}
    .checkout-fields .wide{grid-column:1/-1}
    .checkout-fields label{display:block;margin-bottom:.4rem;font-size:.83rem;font-weight:500;color:var(--clr-text-sub)}
    .checkout-fields input,.checkout-fields select,.checkout-fields textarea{width:100%;padding:.85rem .95rem;border:1px solid var(--clr-border);border-radius:9px;background:var(--clr-bg2);color:var(--clr-text)}
    .checkout-fields input:focus,.checkout-fields select:focus,.checkout-fields textarea:focus{outline:2px solid rgba(200,151,58,.45);border-color:var(--clr-gold)}
    .checkout-fields textarea{min-height:100px;resize:vertical}
    .checkout-summary{padding:1.6rem;position:sticky;top:2rem}
    .checkout-items{display:grid;gap:.8rem;list-style:none;padding:0;margin:0 0 1.2rem}
    .checkout-items li{display:flex;justify-content:space-between;gap:1rem;padding-bottom:.8rem;border-bottom:1px solid var(--clr-border);font-size:.9rem}
    .checkout-items li strong{white-space:nowrap}
    .checkout-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:.5rem;font-weight:600}
    .checkout-total-row strong{font-family:var(--font-display);font-size:1.45rem;color:var(--clr-gold)}
    .checkout-submit{width:100%;justify-content:center;margin-top:1.5rem}
    .checkout-pause-message{padding:.8rem;background:rgba(200,151,58,.12);border-radius:8px;margin-bottom:1rem}
    #checkoutError{color:#c0392b;margin-top:1rem}
    @media(max-width:760px){.checkout-page{padding-top:calc(var(--header-h) + 2rem)}.checkout-layout{grid-template-columns:1fr}.checkout-summary{position:static;grid-row:1}.checkout-fields{grid-template-columns:1fr}.checkout-fields .wide{grid-column:auto}}
    @media(max-width:420px){.checkout-top .logo{font-size:1.35rem}.checkout-top .logo span{display:none}}
  </style>
</head>
<body>
  <main class="checkout-page">
    <div class="container">
      <div class="checkout-top"><a href="index.html" class="logo">LakeBite <span>Nairobi, Kenya</span></a><a class="back-link" href="menu.html"><i class="fa-solid fa-arrow-left"></i> Back to menu</a></div>
      <header class="checkout-heading"><span class="section-label">Almost there</span><h1>Checkout</h1><p>Share your details and choose how you’d like to receive your order.</p></header>
      <div class="checkout-layout">
        <section class="checkout-panel">
          <h2>Your details</h2>
          <form id="checkoutForm">
            <p class="checkout-pause-message" hidden role="status">Online ordering is paused. Please try again later.</p>
            <div class="checkout-fields">
              <div class="admin-form-group wide"><label for="checkoutName">Name</label><input id="checkoutName" name="name" autocomplete="name" required maxlength="100"></div>
              <div class="admin-form-group"><label for="checkoutPhone">Phone</label><input id="checkoutPhone" name="phone" type="tel" autocomplete="tel" required maxlength="40"></div>
              <div class="admin-form-group"><label for="checkoutEmail">Email (optional)</label><input id="checkoutEmail" name="email" type="email" autocomplete="email" maxlength="254"></div>
              <div class="admin-form-group wide"><label for="checkoutType">Fulfilment</label><select id="checkoutType" name="type"><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select></div>
              <div class="admin-form-group wide" id="checkoutAddressGroup" hidden><label for="checkoutAddress">Delivery address</label><textarea id="checkoutAddress" name="address" maxlength="300"></textarea></div>
              <div class="admin-form-group wide"><label for="checkoutNotes">Order notes (optional)</label><textarea id="checkoutNotes" name="notes" maxlength="500"></textarea></div>
              <div class="admin-form-group wide"><label for="checkoutPayment">Payment</label><select id="checkoutPayment" name="paymentMethod"><option value="pay-on-delivery">Pay on delivery / collection</option><option value="mpesa">M-Pesa (not configured)</option></select></div>
            </div>
            <p id="checkoutError" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary checkout-submit" id="checkoutSubmit"><i class="fa-solid fa-lock"></i> Place order</button>
          </form>
        </section>
        <aside class="checkout-summary"><h2>Order summary</h2><ul class="checkout-items" id="checkoutItems"></ul><div class="checkout-total-row"><span>Subtotal</span><strong id="checkoutTotal"></strong></div></aside>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
