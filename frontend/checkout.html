<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — LakeBite</title>
  <meta name="description" content="Complete your LakeBite order.">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body{min-height:100vh;background:radial-gradient(ellipse at 8% 0,rgba(200,151,58,.14),transparent 34%),radial-gradient(ellipse at 100% 45%,rgba(26,61,43,.07),transparent 32%),var(--clr-bg)}
    .checkout-page{padding:3rem 0 5rem}
    .checkout-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem;padding-bottom:1.2rem;border-bottom:1px solid var(--clr-border)}
    .checkout-top .logo{font-size:1.65rem}
    .checkout-top a.back-link{color:var(--clr-text-sub);font-size:.9rem;padding:.55rem .85rem;border:1px solid var(--clr-border);border-radius:50px;transition:all var(--transition)}
    .checkout-top a:hover{color:var(--clr-gold);border-color:var(--clr-gold)}
    .checkout-nav{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;justify-content:flex-end}
    .checkout-nav a{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:44px;padding:.65rem 1rem;border:1px solid var(--clr-border);border-radius:999px;background:var(--clr-card);color:var(--clr-text-sub);font-size:.82rem;font-weight:500;letter-spacing:.025em;box-shadow:0 3px 12px rgba(20,40,28,.04);transition:transform var(--transition),background var(--transition),color var(--transition),border-color var(--transition),box-shadow var(--transition)}
    .checkout-nav a i{font-size:.82rem;color:var(--clr-gold)}
    .checkout-nav a:hover{transform:translateY(-2px);background:var(--clr-primary);color:#fff;border-color:var(--clr-primary);box-shadow:0 7px 18px rgba(26,61,43,.18)}
    .checkout-nav a:hover i{color:var(--clr-gold-lt)}
    .checkout-nav a:focus-visible{outline:3px solid rgba(200,151,58,.45);outline-offset:3px}
    .checkout-nav a:first-child{background:var(--clr-primary);color:#fff;border-color:var(--clr-primary)}
    .checkout-nav a:first-child i{color:var(--clr-gold-lt)}
    .checkout-nav a:first-child:hover{background:var(--clr-primary-lt);border-color:var(--clr-primary-lt)}
    .checkout-heading{margin-bottom:2.2rem}
    .checkout-heading h1{font-size:clamp(2.7rem,5vw,4rem);margin:.2rem 0 .45rem;letter-spacing:-.025em}
    .checkout-heading p{color:var(--clr-text-sub);font-size:1.02rem}
    .checkout-steps{display:flex;gap:.7rem;align-items:center;margin:0 0 1.25rem;color:var(--clr-text-sub);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
    .checkout-steps span{display:inline-flex;align-items:center;gap:.5rem}
    .checkout-steps b{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--clr-primary);color:white;font-size:.72rem}
    .checkout-steps .current{color:var(--clr-primary);font-weight:600}
    .checkout-steps .current b{background:var(--clr-gold)}
    .checkout-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.75fr);gap:clamp(1.25rem,3vw,2.4rem);align-items:start}
    .checkout-panel,.checkout-summary{background:var(--clr-card);border:1px solid color-mix(in srgb,var(--clr-primary) 12%,var(--clr-border));border-radius:20px;box-shadow:0 14px 45px rgba(22,42,30,.08)}
    [data-theme="dark"] .checkout-panel,[data-theme="dark"] .checkout-summary{box-shadow:0 14px 45px rgba(0,0,0,.2)}
    .checkout-panel{padding:clamp(1.25rem,3vw,2.1rem)}
    .checkout-panel h2,.checkout-summary h2{font-size:1.5rem;margin-bottom:1.2rem;color:var(--clr-primary)}
    [data-theme="dark"] .checkout-panel h2,[data-theme="dark"] .checkout-summary h2{color:var(--clr-text)}
    .checkout-panel h2::after,.checkout-summary h2::after{content:"";display:block;width:42px;height:2px;margin-top:.65rem;background:linear-gradient(90deg,var(--clr-gold),var(--clr-gold-lt))}
    .checkout-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 1.15rem;max-width:700px}
    .checkout-fields .admin-form-group{min-width:0;margin:0}
    .checkout-fields .wide{grid-column:1/-1}
    .checkout-fields label{display:flex;align-items:center;gap:.35rem;margin-bottom:.45rem;font-size:.76rem;font-weight:600;letter-spacing:.045em;text-transform:uppercase;color:var(--clr-primary)}
    [data-theme="dark"] .checkout-fields label{color:var(--clr-gold-lt)}
    .checkout-fields input,.checkout-fields select,.checkout-fields textarea{display:block;width:100%;min-width:0;padding:.72rem .85rem;border:1px solid color-mix(in srgb,var(--clr-primary) 18%,var(--clr-border));border-radius:9px;background:color-mix(in srgb,var(--clr-primary) 3%,var(--clr-bg2));color:var(--clr-text);font-size:.9rem;line-height:1.4;transition:border-color var(--transition),box-shadow var(--transition),background var(--transition)}
    .checkout-fields input::placeholder,.checkout-fields textarea::placeholder{color:var(--clr-text-sub);opacity:.65}
    .checkout-fields input:focus,.checkout-fields select:focus,.checkout-fields textarea:focus{outline:none;border-color:var(--clr-gold);background:var(--clr-bg2);box-shadow:0 0 0 4px rgba(200,151,58,.16)}
    .checkout-fields textarea{min-height:82px;resize:vertical}
    .checkout-fields select{min-height:44px;cursor:pointer}
    .checkout-fields input:focus-visible,.checkout-fields select:focus-visible,.checkout-fields textarea:focus-visible{outline:3px solid rgba(200,151,58,.2);outline-offset:1px}
    .checkout-fields .wide textarea{min-height:76px}
    .checkout-summary{padding:1.7rem;position:sticky;top:2rem;overflow:hidden}
    .checkout-summary::before{content:"";display:block;height:4px;position:absolute;top:0;left:0;right:0;background:linear-gradient(90deg,var(--clr-primary),var(--clr-gold-lt))}
    .checkout-items{display:grid;gap:.8rem;list-style:none;padding:0;margin:0 0 1.2rem}
    .checkout-items li{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0 .85rem;border-bottom:1px solid var(--clr-border);font-size:.9rem}
    .checkout-items li strong{white-space:nowrap}
    .checkout-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:.5rem;font-weight:600}
    .checkout-total-row strong{font-family:var(--font-display);font-size:1.45rem;color:var(--clr-gold)}
    .checkout-submit{width:100%;max-width:680px;justify-content:center;margin-top:1.25rem;min-height:48px;border-radius:7px}
    .checkout-pause-message{padding:.9rem 1rem;background:rgba(200,151,58,.12);border:1px solid rgba(200,151,58,.25);border-radius:10px;margin-bottom:1rem;color:var(--clr-text)}
    #checkoutError{color:#c0392b;margin-top:1rem}
    @media(max-width:760px){.checkout-page{padding-top:1.5rem}.checkout-top{margin-bottom:2rem}.checkout-layout{grid-template-columns:1fr}.checkout-summary{position:static;grid-row:1}.checkout-fields{grid-template-columns:repeat(2,minmax(0,1fr));max-width:none;gap:.85rem}.checkout-fields .wide{grid-column:1/-1}.checkout-submit{max-width:none}}
    @media(max-width:520px){.checkout-fields{grid-template-columns:1fr}.checkout-fields .wide{grid-column:auto}}
    @media(max-width:420px){.checkout-top .logo{font-size:1.35rem}.checkout-top .logo span{display:none}}
    @media(max-width:600px){.checkout-top{align-items:flex-start;gap:1rem;flex-direction:column}.checkout-nav{width:100%;justify-content:flex-start}.checkout-nav a{flex:1;padding:.65rem .55rem;font-size:.74rem;white-space:nowrap}}
  </style>
</head>
<body>
  <main class="checkout-page">
    <div class="container">
      <div class="checkout-top"><a href="index.html" class="logo">LakeBite <span>Nairobi, Kenya</span></a><nav class="checkout-nav" aria-label="Checkout navigation"><a class="back-link" href="menu.html?cart=1"><i class="fa-solid fa-arrow-left"></i> Back to cart</a><a class="back-link" href="menu.html"><i class="fa-solid fa-utensils"></i> Back to menu</a><a class="back-link" href="index.html"><i class="fa-solid fa-house"></i> Home</a></nav></div>
      <header class="checkout-heading"><div class="checkout-steps" aria-label="Checkout progress"><span><b><i class="fa-solid fa-check"></i></b> Cart</span><span aria-hidden="true">/</span><span class="current"><b>2</b> Details</span><span aria-hidden="true">/</span><span><b>3</b> Confirmation</span></div><span class="section-label">Almost there</span><h1>Checkout</h1><p>Share your details and choose how you’d like to receive your order.</p></header>
      <div class="checkout-layout">
        <section class="checkout-panel">
          <h2>Your details</h2>
          <form id="checkoutForm">
            <p class="checkout-pause-message" hidden role="status">Online ordering is paused. Please try again later.</p>
            <div class="checkout-fields">
              <div class="admin-form-group wide"><label for="checkoutName">Name</label><input id="checkoutName" name="name" autocomplete="name" required maxlength="100"></div>
              <div class="admin-form-group"><label for="checkoutPhone">Phone</label><input id="checkoutPhone" name="phone" type="tel" autocomplete="tel" required maxlength="40"></div>
              <div class="admin-form-group"><label for="checkoutEmail">Email address</label><input id="checkoutEmail" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></div>
              <div class="admin-form-group wide"><label for="checkoutType">Fulfilment</label><select id="checkoutType" name="type"><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select></div>
              <div class="admin-form-group wide" id="checkoutAddressGroup" hidden><label for="checkoutAddress">Delivery address</label><textarea id="checkoutAddress" name="address" maxlength="300"></textarea></div>
              <div class="admin-form-group wide"><label for="checkoutNotes">Order notes (optional)</label><textarea id="checkoutNotes" name="notes" maxlength="500"></textarea></div>
              <div class="admin-form-group wide"><label for="checkoutPayment">Payment</label><select id="checkoutPayment" name="paymentMethod"><option value="pay-on-delivery">Pay on delivery / collection</option><option value="mpesa">M-Pesa (not configured)</option></select></div>
            </div>
            <p id="checkoutError" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary checkout-submit" id="checkoutSubmit"><i class="fa-solid fa-lock"></i> Place order</button>
          </form>
        </section>
        <aside class="checkout-summary"><h2>Order summary</h2><ul class="checkout-items" id="checkoutItems"></ul><div class="checkout-total-row"><span>Subtotal</span><strong id="checkoutTotal"></strong></div></aside>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
